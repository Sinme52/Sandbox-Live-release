<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f1222">
  <title>Sandbox Live! のゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="screen" aria-label="ゲーム画面"></canvas>
  </div>
  <!-- スマホ用ボタン。使うボタンは src/game.js の controls で決める -->
  <div id="pad" class="pad" hidden>
    <div class="dpad">
      <button data-key="up" aria-label="上">▲</button>
      <button data-key="left" aria-label="左">◀</button>
      <button data-key="right" aria-label="右">▶</button>
      <button data-key="down" aria-label="下">▼</button>
    </div>
    <div class="buttons">
      <button data-key="action" class="action" aria-label="アクション">A</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
<script data-sandbox-live-feedback>(function widget(info) {
  if (document.querySelector('[data-sandbox-live-feedback-host]')) return;
  const tag = `【${info.lane}屋台${info.version ? ` v${info.version}` : ''}】`;
  const host = document.createElement('div');
  host.setAttribute('data-sandbox-live-feedback-host', '');
  host.style.cssText = 'position:fixed;top:0;right:0;z-index:2147483647;';
  const root = host.attachShadow({ mode: 'open' });
  root.innerHTML = `<style>
:host{all:initial}
*{box-sizing:border-box;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif}
.open{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(15,18,34,.6);color:#fff3dc;font-size:14px;font-weight:700;cursor:pointer;opacity:.8}
.open:hover,.open:focus-visible{opacity:1}
.panel{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));width:min(320px,calc(100vw - 16px));padding:14px;border-radius:14px;background:#1f2540;color:#fff3dc;border:2px solid #ff8a3d;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:14px;line-height:1.5}
.panel[hidden],.open[hidden]{display:none}
h2{margin:0 26px 6px 0;font-size:16px;color:#ffb54a}
p{margin:0 0 8px}
.tag{display:block;margin:0 0 10px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.08);font-size:18px;font-weight:700;text-align:center;user-select:text;-webkit-user-select:text}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
button{font:inherit;color:inherit;cursor:pointer}
.kind,.plain{padding:8px 4px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);font-weight:700}
.kind:hover,.plain:hover{border-color:#ff8a3d}
.plain{width:100%;margin-bottom:8px;font-weight:500}
.done{min-height:1.5em;margin:0 0 6px;color:#49d98a;font-weight:700}
.note{margin:0;color:#c9c1b0;font-size:12px}
.close{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;border-radius:50%;background:transparent;font-size:20px;line-height:1}
</style>
<button class="open" type="button" aria-haspopup="dialog">💬 感想</button>
<div class="panel" role="dialog" aria-label="感想・バグ報告" hidden>
  <button class="close" type="button" aria-label="閉じる">×</button>
  <h2>感想・バグ報告はチャットへ！</h2>
  <p>ボタンを押すと目印をコピーします。配信のチャットに貼り付けて、続きを書いてね。</p>
  <span class="tag"></span>
  <div class="kinds">
    <button class="kind" type="button" data-kind="😄 ">😄 たのしい</button>
    <button class="kind" type="button" data-kind="🐛 ">🐛 バグ</button>
    <button class="kind" type="button" data-kind="💡 ">💡 アイデア</button>
  </div>
  <button class="plain" type="button" data-kind="">目印だけコピー</button>
  <p class="done" aria-live="polite"></p>
  <p class="note">名前や連絡先など、個人の情報は書かないでね。</p>
</div>`;
  const $ = (s) => root.querySelector(s);
  const open = $('.open');
  const panel = $('.panel');
  const done = $('.done');
  $('.tag').textContent = tag;

  // ボタンやパネルの操作をゲームに伝えない（ゲームは window でキーを受け取っている）
  for (const type of ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'mousedown', 'mouseup', 'click', 'keydown', 'keyup']) {
    host.addEventListener(type, (e) => e.stopPropagation());
  }

  const show = (on) => {
    panel.hidden = !on;
    open.hidden = on;
    done.textContent = '';
    if (on) $('.kind').focus();
    else open.blur(); // フォーカスが残ると、スペースキーでもう一度開いてしまう
  };

  const copy = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      // 古いブラウザ向け
      const t = document.createElement('textarea');
      t.value = text;
      t.setAttribute('readonly', '');
      t.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      root.append(t);
      t.select();
      let ok = false;
      try {
        ok = document.execCommand('copy');
      } catch {
        ok = false;
      }
      t.remove();
      return ok;
    }
  };

  open.addEventListener('click', () => show(true));
  $('.close').addEventListener('click', () => show(false));
  panel.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') show(false);
  });
  for (const b of root.querySelectorAll('[data-kind]')) {
    b.addEventListener('click', async () => {
      const text = `${tag}${b.dataset.kind}`;
      const ok = await copy(text);
      done.textContent = ok ? `「${text.trim()}」をコピーしました！` : `コピーできませんでした。「${text.trim()}」と書いてね`;
    });
  }
  document.body.append(host);
})({"lane":"A","version":2});</script></body>
</html>
