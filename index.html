<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandbox Live!</title>
<style>
:root{--bg:#14182b;--card:#1f2540;--ink:#fff3dc;--sub:#c9c1b0;--accent:#ff8a3d;--lamp:#ffb54a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif}
header{padding:32px 16px 8px;text-align:center}
h1{margin:0;font-size:clamp(28px,7vw,48px);color:var(--lamp)}
header p{margin:6px 0 0;color:var(--sub)}
main{max-width:880px;margin:0 auto;padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{position:relative;padding:16px;border-radius:14px;background:var(--card);border:2px solid transparent}
.card:hover,.card:focus-within{border-color:var(--accent)}
.card a.play{color:inherit;text-decoration:none}
.card a.play::after{content:"";position:absolute;inset:0}
.lane{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--accent);color:#1a1206;font-weight:700;font-size:13px}
.title{margin:10px 0 4px;font-size:20px;font-weight:700}
.meta{color:var(--sub);font-size:13px}
.src{position:relative;z-index:1;display:inline-block;margin-top:8px;color:var(--lamp);font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:var(--sub)}
footer{padding:24px 16px 40px;text-align:center;color:var(--sub);font-size:13px}
footer a{color:var(--lamp)}
</style></head><body>
<header><h1>Sandbox Live!</h1><p>〜コメントでつくるゲーム屋台〜</p></header>
<main id="list"><p class="empty">読み込み中…</p></main>
<footer id="foot"></footer>
<script>
fetch('manifest.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (m) {
  var list = document.getElementById('list');
  var games = Object.keys(m.games).map(function (id) { return Object.assign({ id: id }, m.games[id]); })
    .sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)); });
  list.textContent = '';
  if (!games.length) { list.innerHTML = '<p class="empty">まだ公開中のゲームはありません</p>'; return; }
  games.forEach(function (g) {
    var card = document.createElement('div'); card.className = 'card';
    var lane = document.createElement('span'); lane.className = 'lane'; lane.textContent = g.lane + '屋台';
    var t = document.createElement('div'); t.className = 'title';
    var a = document.createElement('a'); a.className = 'play'; a.textContent = g.title;
    a.href = 'games/' + encodeURIComponent(g.id) + '/v' + g.latest + '/';
    t.append(a);
    var meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = (g.requester ? 'お題: ' + g.requester + ' さん ・ ' : '') + 'v' + g.latest + ' ・ ' + new Date(g.createdAt).toLocaleDateString('ja-JP');
    card.append(lane, t, meta);
    if (g.source && /^https:\/\/github\.com\//.test(g.source)) {
      var s = document.createElement('a'); s.className = 'src'; s.href = g.source; s.textContent = 'ソースを見る ↗'; s.rel = 'noopener';
      card.append(s);
    }
    list.append(card);
  });
  if (m.repoUrl && /^https:\/\/github\.com\//.test(m.repoUrl)) {
    var f = document.getElementById('foot'); var l = document.createElement('a');
    l.href = m.repoUrl; l.textContent = 'GitHub'; l.rel = 'noopener'; f.append(l);
  }
});
</script>
</body></html>
